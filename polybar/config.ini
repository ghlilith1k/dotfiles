[bar/main]
width = 100%
height = 25
background = #00000000
foreground = #999999

font-0 = JetBrains Mono:size=15;2
font-1 = Symbols Nerd Font Mono:size=15;2

module-margin = 1
modules-left = date battery pipewire cava-left
modules-center = bspwm
modules-right = cava-right cpu memory temperature

[module/bspwm]
type = internal/bspwm
label-focused-background = #555555
label-focused-underline = #99999
label-focused-padding = 1

[module/date]
type = internal/date
interval = 1
date = %H:%M:%S |

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
interval = 1
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging =󰂄 %percentage%% |
label-discharging =󰂃 %percentage%% |
label-full = 󰁹 %percentage%% |

[module/cpu]
type = internal/cpu
interval = 1
format = <label>
label =| 󰍛 %percentage%% 

[module/memory]
type = internal/memory
interval = 1
format = <label>
label =|   %percentage_used%%

[module/pipewire]
type = internal/pulseaudio
format-volume = <label-volume>
format-muted = <label-muted>
label-volume =󰕾 %percentage%% |
label-muted =󰖁 |

[module/temperature]
type = internal/temperature
interval = 1
format = <label>
label =| 󰔏 %temperature-c%

[module/cava-left]
type = custom/script
tail = true
exec = ~/.config/polybar/cava.sh
format = <label>
forma-font = 5
label = %output%

[module/cava-right]
type = custom/script
tail = true
exec = sleep 1 && ~/.config/polybar/cava.sh
format = <label>
forma-font = 5
label = %output%
